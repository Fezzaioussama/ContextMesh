name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned quality tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-quality.txt
          npm ci
      - name: Lint and format checks
        run: make quality
