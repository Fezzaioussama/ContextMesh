name: Initial assistant checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contextmesh
          POSTGRES_PASSWORD: contextmesh
          POSTGRES_DB: contextmesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextmesh -d contextmesh_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CONTEXTMESH_TEST_DATABASE_URL: postgresql+psycopg://contextmesh:contextmesh@127.0.0.1:5432/contextmesh_test
      CONTEXTMESH_DATABASE_URL: postgresql+psycopg://contextmesh:contextmesh@127.0.0.1:5432/contextmesh_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install application dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --project backend --locked
          npm ci
      - name: Backend, frontend behavior, types, and build
        run: make app-test
      - name: Install browser for integration verification
        run: uv run --project backend --locked --with playwright==1.58.0 python -m playwright install --with-deps chromium
      - name: Browser to API to provider fixture
        run: make smoke
      - name: Browser to API to OpenRouter fixture
        run: make smoke SMOKE_PROVIDER=openrouter
