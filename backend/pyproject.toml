[project]
name = "context-mesh"
version = "0.1.0"
description = "ContextMesh API and bounded foundation assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.15,<5",
  "fastapi>=0.115,<1",
  "httpcore>=1.0.9,<2",
  "langgraph>=1.2,<2",
  "openai>=2,<3",
  "openpyxl>=3.1.5,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.19,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0.2,<2",
  "qdrant-client>=1.19,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL via CONTEXTMESH_TEST_DATABASE_URL"]
# The in-memory Qdrant used by tests ignores payload indexes; server Qdrant uses them.
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
